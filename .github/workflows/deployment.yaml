name: Deploy Face Recognition Web App
on:
  push:
    branches:
      - part2

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SSH_KEY_PRIVATE: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
  AWS_SSH_KEY_PUBLIC: ${{ secrets.AWS_SSH_KEY_PUBLIC }}

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      ele_instance_ip: ${{ steps.get_ip.outputs.INSTANCE_IP }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        id: initialization
        run: terraform init
        working-directory: ./Terraform
      
      - name: Destroy existing infrastructure
        if: false  # Change to 'true' temporarily to destroy existing infra
        run: terraform destroy -auto-approve \
          -var "public_key=$AWS_SSH_KEY_PUBLIC" \
          -var "private_key=$AWS_SSH_KEY_PRIVATE"
        working-directory: ./Terraform
      
      - name: Terraform Plan
        id: plan
        run: |-
          terraform plan \
          -var "public_key=$AWS_SSH_KEY_PUBLIC" \
          -var "private_key=$AWS_SSH_KEY_PRIVATE" \
          -out=PLAN
        working-directory: ./Terraform

      - name: Apply Terraform configuration
        run: terraform apply PLAN
        working-directory: ./Terraform
      
      # - name: Get the instance public IP
      #   id: get_ip
      #   run: |
      #     echo "INSTANCE_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT
      #     echo "Instance Public IP: $INSTANCE_IP"
      #   working-directory: ./Terraform

      # This for the elastic IP.
      - name: Get the instance public IP
        id: get_ip
        run: |
          echo "INSTANCE_IP=$(terraform output -raw elastic_ip)" >> $GITHUB_OUTPUT
          echo "Instance Public IP: $INSTANCE_IP"
        working-directory: ./Terraform
      
      - name: Print the instance public IP
        run: |
          echo "Instance Public IP: ${{ steps.get_ip.outputs.INSTANCE_IP }}"

  deploy-app:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Set the public IP
        run: echo "INSTANCE_IP=98.90.157.134" >> $GITHUB_ENV
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: set the public IP env variable
        id: env_ip
        run: echo "INSTANCE_IP=${{ needs.deploy-infra.outputs.ele_instance_ip }}" >> $GITHUB_ENV
      
      - name: Login to AWS ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR repository if not exists
        env:
          AWS_DEFAULT_REGION: us-east-1
          REPOSITORY: cse546-project1-part2-repo
        run: |
          aws ecr describe-repositories --repository-names "$REPOSITORY" --region "$AWS_DEFAULT_REGION" || \
          aws ecr create-repository --repository-name "$REPOSITORY" --region "$AWS_DEFAULT_REGION"

      - name: Build and Push Web-Tier Docker Image
        env: 
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: cse546-project1-part2-repo
          IMAGE_TAG: ${{ github.sha }}
          AWS_DEFAULT_REGION: us-east-1
        run: |-
          docker build -f ./web-tier/Dockerfile.web -t $REGISTRY/$REPOSITORY-web:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY-web:$IMAGE_TAG
        working-directory: ./
        
      - name: Build and Push Controller Docker Image
        env: 
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: cse546-project1-part2-repo
          IMAGE_TAG: ${{ github.sha }}
          AWS_DEFAULT_REGION: us-east-1
        run: |-
          docker build -f ./controller/Dockerfile.controller -t $REGISTRY/$REPOSITORY-controller:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY-controller:$IMAGE_TAG
        working-directory: ./

      # - name: Wait for EC2 instance to be ready
      #   run: |
      #     echo "Waiting for EC2 instance to be ready..."
      #     sleep 60

      - name: Deploy docker img to EC2 instance
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: cse546-project1-part1-repo
          INSTANCE_IP: ${{ env.INSTANCE_IP }}
          SSH_KEY: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_DEFAULT_REGION: us-east-1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
          envs: AWS_SSH_KEY_PRIVATE,REGISTRY,REPOSITORY,IMAGE_TAG,AWS_DEFAULT_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,AWS_SSH_KEY_PUBLIC,AWS_TF_STATE_BUCKET_NAME
          script: |
            # Error handling
            set -e
            trap 'echo "Error occurred on line $LINENO"; exit 1' ERR
            
            # Install Docker and Docker Compose if not already installed
            sudo apt-get update
            sudo apt-get install -y docker.io awscli
            sudo apt-get install -y docker-compose
            
            # Start Docker service
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Configure AWS credentials for the ubuntu user
            mkdir -p ~/.aws
            echo "[default]" > ~/.aws/credentials
            echo "aws_access_key_id = $AWS_ACCESS_KEY_ID" >> ~/.aws/credentials
            echo "aws_secret_access_key = $AWS_SECRET_ACCESS_KEY" >> ~/.aws/credentials
            echo "[default]" > ~/.aws/config
            echo "region = $AWS_DEFAULT_REGION" >> ~/.aws/config
            
            aws ecr get-login-password --region $AWS_DEFAULT_REGION | sudo docker login --username AWS --password-stdin $REGISTRY
            
            # Stop and remove existing container (if any)
            sudo docker stop web || true
            sudo docker rm web || true
            sudo docker stop controller || true
            sudo docker rm controller || true

            # Copy the compose file to the EC2 instance
            scp -i $AWS_SSH_KEY_PRIVATE compose.yaml ubuntu@${INSTANCE_IP}:/home/ubuntu/docker-compose.yml
            
            # Deploy the application using Docker Compose
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" > .env
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env
            echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION" >> .env

            # Add other environment variables as needed
            echo "INPUT_BUCKET_NAME=0000000000-in-bucket" >> .env
            echo "OUTPUT_BUCKET_NAME=0000000000-out-bucket" >> .env
            echo "SEND_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/123456789012/0000000000-req-queue" >> .env
            echo "RECEIVE_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/123456789012/0000000000-resp-queue" >> .env
            echo "AMI_ID=ami-0172bcd94efa5ae95" >> .env

            # Copy the .env file to the EC2 instance
            scp -i $SSH_KEY .env ubuntu@${INSTANCE_IP}:/home/ubuntu/.env
            sudo docker-compose -f /home/ubuntu/docker-compose.yml up -d


